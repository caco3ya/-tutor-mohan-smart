<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tutor Mohan - Smart PPT Generator</title>
    <!-- Import Fredoka Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- PDF parsing library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Fredoka', sans-serif; }
        .brand-tutor { color: #0A2540; } /* Navy Blue */
        .brand-mohan { color: #FF6B35; } /* Orange */
        .drop-zone { border: 3px dashed #FF6B35; transition: all 0.3s ease; }
        .drop-zone.dragover { background: rgba(255, 107, 53, 0.08); border-color: #0A2540; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
        <!-- Exact Brand Identity Header -->
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-100">
            <h1 class="text-3xl font-bold tracking-tight">
                <span class="brand-tutor">tutor</span><span class="brand-mohan">Mohan</span>
            </h1>
            <span class="text-xs bg-slate-100 text-slate-500 font-mono px-3 py-1 rounded-full">tutor-mohan-smart</span>
        </div>

        <p class="text-slate-600 mb-6 text-sm">
            Upload your lesson or script PDF below. The AI will extract the content and convert it into a beautifully branded presentation with interactive, hidden-reveal answers.
        </p>

        <!-- Dynamic User Inputs -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">API Endpoint Provider</label>
                <select id="apiProvider" class="w-full p-3 rounded-xl border border-slate-200 text-slate-800 bg-white focus:outline-none focus:border-[#FF6B35]">
                    <option value="openai">OpenAI (GPT-4o-mini)</option>
                    <option value="gemini">Google Gemini (1.5 Flash)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Secret API Key</label>
                <input type="password" id="apiKey" placeholder="Paste your API key here..." class="w-full p-3 rounded-xl border border-slate-200 text-slate-800 focus:outline-none focus:border-[#FF6B35]">
            </div>
        </div>

        <!-- Drag & Drop Zone Container -->
        <div id="dropZone" class="drop-zone p-10 rounded-2xl text-center cursor-pointer mb-6 bg-slate-50/50 hover:bg-slate-50 transition">
            <div class="text-4xl mb-2">📁</div>
            <p class="text-slate-700 font-medium">Drag & drop your text PDF document here</p>
            <p class="text-xs text-slate-400 mt-1">or click to browse local files</p>
            <input type="file" id="fileInput" accept=".pdf" class="hidden">
        </div>

        <button id="generateBtn" class="w-full bg-[#0A2540] hover:bg-[#11375c] text-white font-bold p-4 rounded-xl transition duration-200 shadow-md cursor-pointer hidden">
            ✨ Build tutor Mohan Presentation
        </button>
        
        <div id="status" class="mt-4 text-center text-sm font-medium text-slate-500"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const generateBtn = document.getElementById('generateBtn');
        const status = document.getElementById('status');
        let extractedText = "";

        // Drag and drop event handling listeners
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dropover'); // Reset visual
            handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file || file.type !== "application/pdf") {
                alert("Please drop a valid PDF file.");
                return;
            }
            status.innerText = "⏳ Extracting raw text from document pages...";
            const reader = new FileReader();
            reader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument(typedarray).promise.then(async function(pdf) {
                    let text = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(" ") + "
";
                    }
                    extractedText = text;
                    status.innerHTML = `✅ Ready to compile: <span class="text-slate-800 font-semibold">${file.name}</span>`;
                    generateBtn.classList.remove('hidden');
                }).catch(err => {
                    status.innerText = "❌ Failed to parse PDF file content.";
                    console.error(err);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        // Injects the custom tutor Mohan typography and Reveal.js infrastructure
        function generateRevealTemplate(slidesContent) {
            return `<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>tutor Mohan Presentation</title>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/white.min.css">
        <style>
            body, .reveal { font-family: 'Fredoka', sans-serif; background: #fafafa; }
            .reveal .slides { text-align: left; }
            .brand-watermark {
                position: absolute;
                top: 30px;
                right: 40px;
                font-size: 24px;
                font-weight: 700;
                z-index: 999;
                user-select: none;
            }
            .tutor-navy { color: #0A2540; }
            .mohan-orange { color: #FF6B35; }
            .reveal h2 { font-family: 'Fredoka', sans-serif; font-weight: 700; color: #0A2540; margin-bottom: 20px; }
            .question-container {
                border-left: 6px solid #FF6B35;
                padding-left: 20px;
                margin-top: 30px;
                font-size: 32px;
                color: #334155;
                font-weight: 600;
            }
            .answer-box {
                background: #ffffff;
                padding: 25px;
                border-radius: 16px;
                border: 2px solid #e2e8f0;
                color: #FF6B35;
                font-size: 28px;
                font-weight: 600;
                margin-top: 35px;
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            }
        </style>
    </head>
    <body>
        <div class="brand-watermark"><span class="tutor-navy">tutor</span><span class="mohan-orange">Mohan</span></div>
        <div class="reveal">
            <div class="slides">
                ${slidesContent}
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.js"><\/script>
        <script>
            Reveal.initialize({ hash: true, controls: true, progress: true, center: true });
        <\/script>
    </body>
</html>`;
        }

        generateBtn.addEventListener('click', async () => {
            const key = document.getElementById('apiKey').value.trim();
            const provider = document.getElementById('apiProvider').value;
            
            if (!key) {
                alert("Please type your API key to request generation.");
                return;
            }
            
            status.innerText = "🧠 tutor Mohan AI is structuring your slides...";
            
            const prompt = `You are a curriculum design engine for 'tutor Mohan'. Analyze this text and generate clean presentation slide markup. 
            Break down concepts into distinct slide blocks using <section> elements.
            For each key piece of information, create an analytical prompt or question inside a <div class="question-container"> box.
            Directly below the question, put the exact explanatory answer wrapped inside a <div class="answer-box fragment"> box.
            The 'fragment' class is critical to ensure answers are hidden until clicked or advanced. Output ONLY pure slide HTML data. Do not include markdown code block syntax (like \`\`\`html) or conversational text.
            Text data: ${extractedText.substring(0, 6000)}`;

            try {
                let responseText = "";
                
                if (provider === "openai") {
                    const res = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json", 
                            "Authorization": `Bearer ${key}` 
                        },
                        body: JSON.stringify({
                            model: "gpt-4o-mini",
                            messages: [{ role: "user", content: prompt }]
                        })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    responseText = data.choices.message.content;
                    
                } else if (provider === "gemini") {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: prompt }] }] 
                        })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    responseText = data.candidates.content.parts.text;
                }

                // Strip structural Markdown wraps if the AI accidentally ignores formatting rules
                responseText = responseText.replace(/```html/g, "").replace(/```/g, "").trim();

                // Compile content into standard layout presentation envelope
                const finalHTML = generateRevealTemplate(responseText);
                
                // Compile a downloadable Blob file artifact natively in the browser
                const blob = new Blob([finalHTML], { type: "text/html" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "tutor_mohan_smart_deck.html";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                status.innerText = "🚀 Presentation compiled and downloaded successfully!";
            } catch (err) {
                status.innerText = `❌ Error: ${err.message || "Check your key configurations and API limits."}`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
